name: 📱 Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: 🤖 Compile Android Standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: ⚙️ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Root & Mobile Dependencies
        run: |
          npm install
          cd mobile && npm install

      - name: 🏗️ Generate Android Native Project
        working-directory: ./mobile
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Compile Android APK via Gradle
        working-directory: ./mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" || ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: 📂 Locate and Prepare APK for Distribution
        run: |
          mkdir -p build-output docs
          APK_PATH=$(find mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" build-output/manifest-v1.1.2.apk
            cp "$APK_PATH" docs/manifest.apk
            echo "✅ APK located at $APK_PATH and copied to build-output/manifest-v1.1.2.apk and docs/manifest.apk"
          else
            echo "❌ APK not found in outputs directory!" && exit 1
          fi

      - name: 📤 Upload APK as GitHub Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-android-apk
          path: build-output/manifest-v1.1.2.apk
          retention-days: 30

      - name: 🚀 Publish GitHub Release with APK Attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.2-android
          name: "Manifest v1.1.2 • Android Native App Release"
          body: |
            ## ☀️ Morning Manifestation • Android Release v1.1.2

            ### 📱 Download & Install:
            - **Direct APK Download**: Download [`manifest-v1.1.2.apk`](https://github.com/Harixomxsingh/manifest/releases/download/v1.1.2-android/manifest-v1.1.2.apk)
            - **Web Application**: [https://harixomxsingh.github.io/manifest/](https://harixomxsingh.github.io/manifest/)

            ### ✨ Key Features:
            - **☀️ Illuminating Sun Logo**: Dawn pulse aura and 12-ray rotation.
            - **🌡️ Default Celsius (°C) Climate**: Native temperature & weather intelligence.
            - **🔥 Minimalist Real-Time Streak Sync**: `🔥 <count>` daily streak tracker.
            - **🛡️ Zero-Data-Loss Local Vault**: Redundant snapshot backups and 1-click JSON export.
            - **⚡ Live OTA Updates**: Automatic silent background updates via `expo-updates`.
            - **© PolyForm Noncommercial License 1.0.0** by Hari.
          files: build-output/manifest-v1.1.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
