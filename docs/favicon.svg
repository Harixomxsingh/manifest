<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#080B11" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E5B869" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#334155" stroke-width="6" />
  
  <!-- Ambient Glow -->
  <circle cx="256" cy="270" r="140" fill="#F59E0B" opacity="0.15" filter="url(#glow)" />
  
  <!-- Horizon Line -->
  <path d="M96 320 L416 320" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" opacity="0.6" />
  
  <!-- Rising Sun -->
  <circle cx="256" cy="300" r="88" fill="url(#sunGrad)" filter="url(#glow)" />
  
  <!-- Rising Sun Aura Rays -->
  <path d="M256 140 L256 190" stroke="url(#sunGrad)" stroke-width="6" stroke-linecap="round" />
  <path d="M140 188 L176 224" stroke="url(#sunGrad)" stroke-width="6" stroke-linecap="round" />
  <path d="M372 188 L336 224" stroke="url(#sunGrad)" stroke-width="6" stroke-linecap="round" />
  <path d="M90 300 L140 300" stroke="url(#sunGrad)" stroke-width="6" stroke-linecap="round" />
  <path d="M422 300 L372 300" stroke="url(#sunGrad)" stroke-width="6" stroke-linecap="round" />

  <!-- Geometric Diamond/Star Pinnacle -->
  <path d="M256 90 L266 116 L292 126 L266 136 L256 162 L246 136 L220 126 L246 116 Z" fill="#FDE68A" />
</svg>