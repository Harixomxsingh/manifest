<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Morning Manifestation — Dawn Manifest Edition</title>
    <meta name="description" content="Executive morning dispatch eliminating decision fatigue, triaging inbox & schedule, dynamic James Clear reading, climate tactics, and anchoring unshakeable optimism." />
    
    <!-- PWA Settings -->
    <meta name="theme-color" content="#FDF9F1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Manifest" />
    <link rel="manifest" href="./manifest.webmanifest" />
    
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.svg" />

    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <!-- Google Identity Services (GIS) Client -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" crossorigin src="/manifest/assets/index-DqVEb7KT.js"></script>
    <link rel="stylesheet" crossorigin href="/manifest/assets/index-Lgm1BiUT.css">
  </head>
  <body class="bg-[#FDF9F1] text-[#1C1C17] antialiased min-h-screen selection:bg-amber-100 selection:text-amber-900">
    <div id="root"></div>
    <script>
      // Fallback loader for GitHub Pages deployments serving from repository root
      if (window.location.hostname.includes('github.io') && !window.__MANIFEST_DEV__) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/manifest/assets/index-CxLLGle7.css';
        document.head.appendChild(link);

        const script = document.createElement('script');
        script.type = 'module';
        script.crossOrigin = 'anonymous';
        script.src = '/manifest/assets/index-yyU1GIq_.js';
        document.body.appendChild(script);
      }

      // Service Worker Registration for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch((err) => {
            console.log('SW registration note:', err.message);
          });
        });
      }
    </script>
  </body>
</html>
