<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient (Dawn Canvas) -->
    <radialGradient id="dawnBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FDF9F1" stop-opacity="1" />
      <stop offset="100%" stop-color="#FDF9F1" stop-opacity="1" />
    </radialGradient>

    <!-- Outer Aura Glow Gradient -->
    <radialGradient id="sunAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#FCD34D" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FDF9F1" stop-opacity="0" />
    </radialGradient>

    <!-- Luminous Sun Core Gradient -->
    <radialGradient id="sunCore" cx="36%" cy="34%" r="66%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFFBEB" />
      <stop offset="55%" stop-color="#FDE68A" />
      <stop offset="80%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>

    <!-- Solar Rays Linear Gradient -->
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base with rounded corners -->
  <rect width="512" height="512" rx="120" fill="url(#dawnBg)" stroke="#FDE68A" stroke-width="4" />

  <!-- Layer 1: Ambient Breathing Sun Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#sunAura)" />
  <circle cx="256" cy="256" r="160" fill="url(#sunAura)" opacity="0.8" />

  <!-- Layer 2: 12 Illuminating Solar Rays -->
  <!-- Cardinal Rays (North, East, South, West) -->
  <line x1="256" y1="166" x2="256" y2="88" stroke="url(#rayGrad)" stroke-width="18" stroke-linecap="round" />
  <line x1="256" y1="346" x2="256" y2="424" stroke="url(#rayGrad)" stroke-width="18" stroke-linecap="round" />
  <line x1="166" y1="256" x2="88" y2="256" stroke="url(#rayGrad)" stroke-width="18" stroke-linecap="round" />
  <line x1="346" y1="256" x2="424" y2="256" stroke="url(#rayGrad)" stroke-width="18" stroke-linecap="round" />

  <!-- Diagonal Rays (45deg angles) -->
  <line x1="192.3" y1="192.3" x2="137.2" y2="137.2" stroke="url(#rayGrad)" stroke-width="14" stroke-linecap="round" />
  <line x1="319.7" y1="192.3" x2="374.8" y2="137.2" stroke="url(#rayGrad)" stroke-width="14" stroke-linecap="round" />
  <line x1="192.3" y1="319.7" x2="137.2" y2="374.8" stroke="url(#rayGrad)" stroke-width="14" stroke-linecap="round" />
  <line x1="319.7" y1="319.7" x2="374.8" y2="374.8" stroke="url(#rayGrad)" stroke-width="14" stroke-linecap="round" />

  <!-- Sub-Intermediate Rays (30deg / 60deg angles) -->
  <line x1="211.0" y1="178.0" x2="177.0" y2="119.0" stroke="url(#rayGrad)" stroke-width="11" stroke-linecap="round" opacity="0.9" />
  <line x1="301.0" y1="178.0" x2="335.0" y2="119.0" stroke="url(#rayGrad)" stroke-width="11" stroke-linecap="round" opacity="0.9" />
  <line x1="211.0" y1="334.0" x2="177.0" y2="393.0" stroke="url(#rayGrad)" stroke-width="11" stroke-linecap="round" opacity="0.9" />
  <line x1="301.0" y1="334.0" x2="335.0" y2="393.0" stroke="url(#rayGrad)" stroke-width="11" stroke-linecap="round" opacity="0.9" />

  <!-- Layer 3: Radiant Illuminating Sun Sphere -->
  <circle cx="256" cy="256" r="102" fill="url(#sunCore)" filter="url(#softBloom)" />

  <!-- Inner Shimmer Ring -->
  <circle cx="256" cy="256" r="95" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.6" fill="none" />
</svg>
